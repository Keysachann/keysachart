<!DOCTYPE html>
<html lang="ja">

<head>
    <title>Keysa's_Chart_Table</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="bmstable" content="header.json" />

    <script src="https://code.jquery.com/jquery-2.2.4.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js">
    </script>
</head>

<body>

    <header class="mb-3">
        <nav class="navbar navbar-dark bg-dark">
            <div class="container-fluid">
                <span class="navbar-brand mb-0 h1">
                    Keysa's_Chart_Table
                </span>
            </div>
        </nav>
    </header>

    <div class="container">

        <div class="alert alert-success mb-3" role="alert">
            <p>きーさ（Keysa）が公開したBMS作品や差分を集めました。</p>
            <p>Ksl(n)=sl(n)、Kst(n)=st(n)、K?は査定困難。</p>
            <p>2026年5月29日:LR2IRの閉鎖に伴い、MochaIRからデータを習得できるようにしました。</p>
            <hr>
            <p class="mb-0">連絡先 X:@Keysa_Vtuber</p>
        </div>

        <!-- 難易度表 -->
        <div class="table-responsive">
            <table class="table table-light table-striped table-hover" id="table_int">
            </table>
        </div>

    </div>

    <script>

        $(document).ready(function () {

            $.getJSON($("meta[name=bmstable]").attr("content"), function (header) {

                $.getJSON(header.data_url, function (information) {

                    makeBMSTable(information, header.symbol);

                }).fail(function () {

                    $("#table_int").html(
                        "<tr><td>JSONの読み込みに失敗しました。</td></tr>"
                    );

                });

            });

        });

        function makeBMSTable(info, mark) {

            var obj = $("#table_int");

            obj.html("");

            // ヘッダー
            obj.append(
                "<thead class='table-dark'>" +
                "<tr>" +
                "<th>Level</th>" +
                "<th>Title</th>" +
                "<th>Artist</th>" +
                "<th>本体</th>" +
                "<th>差分</th>" +
                "<th>Comment</th>" +
                "</tr>" +
                "</thead>"
            );

            var tbody = $("<tbody></tbody>");

            obj.append(tbody);

            var currentLevel = "";
            var count = 0;
            var levelRow = null;

            for (var i = 0; i < info.length; i++) {

                // レベル変更時
                if (currentLevel !== info[i].level) {

                    if (levelRow) {

                        levelRow.html(
                            "<td colspan='6'><b>" +
                            mark +
                            currentLevel +
                            " (" +
                            count +
                            "譜面)</b></td>"
                        );

                    }

                    currentLevel = info[i].level;
                    count = 0;

                    levelRow = $(
                        "<tr class='table-dark text-center'></tr>"
                    );

                    tbody.append(levelRow);

                }

                var row = $("<tr></tr>");

                // Level
                row.append(
                    "<td>" +
                    mark +
                    currentLevel +
                    "</td>"
                );

                // Title (mochaIR sha256)
                row.append(
                    "<td>" +
                    (
                        info[i].sha256
                            ? "<a href='https://mocha-repository.info/song.php?sha256=" +
                              info[i].sha256 +
                              "' target='_blank' rel='noopener noreferrer'>" +
                              (info[i].title || "") +
                              "</a>"
                            : (info[i].title || "")
                    ) +
                    "</td>"
);

                // Artist
                row.append(
                    "<td>" +
                    (info[i].artist || "") +
                    "</td>"
                );

                // 本体
                row.append(
                    "<td>" +
                    (
                        info[i]["本体"]
                            ? "<a href='" +
                              info[i]["本体"] +
                              "' target='_blank' rel='noopener noreferrer'>本体</a>"
                            : ""
                    ) +
                    "</td>"
                );

                // 差分
                row.append(
                    "<td>" +
                    (
                        info[i]["差分"]
                            ? "<a href='" +
                              info[i]["差分"] +
                              "' target='_blank' rel='noopener noreferrer'>差分</a>"
                            : ""
                    ) +
                    "</td>"
                );

                // Comment
                row.append(
                    "<td>" +
                    (info[i].comment || "") +
                    "</td>"
                );

                tbody.append(row);

                count++;
            }

            // 最後のレベル行
            if (levelRow) {

                levelRow.html(
                    "<td colspan='6'><b>" +
                    mark +
                    currentLevel +
                    " (" +
                    count +
                    "譜面)</b></td>"
                );

            }

        }

    </script>

</body>

</html>
