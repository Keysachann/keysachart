<!DOCTYPE html>
<html lang="ja">

<head>
    <title>Keysa's_Chart_Table</title>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="bmstable" content="header.json" />

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-2.2.4.min.js"></script>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js"></script>

    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: "M PLUS Rounded 1c", sans-serif;
        }

        .navbar-brand {
            font-family: "Kiwi Maru", serif;
            font-size: 1.6rem;
        }
    </style>

</head>

<body>

<header class="mb-3">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Keysa's_Chart_Table</span>
        </div>
    </nav>
</header>

<div class="container">

    <div class="alert alert-success mb-3" role="alert">
        <p>きーさ（Keysa）が制作したsl、stクラスの差分(同梱含む)を集めました。</p>
        <p>Ksl(n)=sl(n)、Kst(n)=st(n)、K?は査定困難。</p>
        <p>2026年6月22日:各種リンク統合版</p>
    </div>

    <div class="table-responsive">
        <table class="table table-light table-striped table-hover" id="table_int"></table>
    </div>

</div>

<script>

$(document).ready(function () {

    $.getJSON($("meta[name=bmstable]").attr("content"), function (header) {

        $.getJSON(header.data_url, function (info) {

            makeBMSTable(info);

        }).fail(function () {

            $("#table_int").html("<tr><td>JSON読み込み失敗</td></tr>");

        });

    });

});

function makeBMSTable(info) {

    const obj = $("#table_int");
    obj.html("");

    // ヘッダー（9列）
    obj.append(
        "<thead class='table-dark'><tr>" +

        "<th>Level</th>" +
        "<th>動画</th>" +
        "<th>Title</th>" +
        "<th>☕</th>" +
        "<th>Artist</th>" +
        "<th>本体</th>" +
        "<th>差分</th>" +
        "<th>Comment</th>" +
        "<th>🎹</th>" +

        "</tr></thead>"
    );

    const tbody = $("<tbody></tbody>");
    obj.append(tbody);

    for (let i = 0; i < info.length; i++) {

        const d = info[i];

        const row = $("<tr></tr>");

        // Level
        row.append("<td>" + (d.level || "") + "</td>");

        // YouTube
        row.append(
            "<td>" +
            (d.youtube
                ? "<a href='" + d.youtube + "' target='_blank' rel='noopener noreferrer'>▶</a>"
                : "—"
            ) +
            "</td>"
        );

        // Title → bms-IR (md5)
        row.append(
            "<td>" +
            (d.md5
                ? "<a href='https://www.bms-ir.org/new/song?songmd5=" +
                  d.md5 +
                  "' target='_blank' rel='noopener noreferrer'>" +
                  (d.title || "") +
                  "</a>"
                : (d.title || "")
            ) +
            "</td>"
        );

        // MochaIR (sha256)
        row.append(
            "<td>" +
            (d.sha256
                ? "<a href='https://mocha-repository.info/song.php?sha256=" +
                  d.sha256 +
                  "' target='_blank' rel='noopener noreferrer'>☕</a>"
                : ""
            ) +
            "</td>"
        );

        // Artist
        row.append("<td>" + (d.artist || "") + "</td>");

        // 本体
        row.append(
            "<td>" +
            (d["本体"]
                ? "<a href='" + d["本体"] + "' target='_blank' rel='noopener noreferrer'>link</a>"
                : ""
            ) +
            "</td>"
        );

        // 差分
        row.append(
            "<td>" +
            (d["差分"]
                ? "<a href='" + d["差分"] + "' target='_blank' rel='noopener noreferrer'>link</a>"
                : ""
            ) +
            "</td>"
        );

        // Comment
        row.append("<td>" + (d.comment || "") + "</td>");

        // Score Viewer
        row.append(
            "<td>" +
            (d.md5
                ? "<a href='https://bms-score-viewer.pages.dev/view?md5=" +
                  d.md5 +
                  "' target='_blank' rel='noopener noreferrer'>🎹</a>"
                : ""
            ) +
            "</td>"
        );

        tbody.append(row);
    }

    // DataTables初期化（重要）
    $('#table_int').DataTable({
        pageLength: 50,
        order: [[0, "asc"]],
        language: {
            search: "🔍",
            lengthMenu: "_MENU_件表示",
            info: "_TOTAL_件中 _START_～_END_件",
            paginate: {
                first: "先頭",
                last: "最後",
                next: "→",
                previous: "←"
            }
        }
    });

}

</script>

</body>
</html>
