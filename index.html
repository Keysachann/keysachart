<script>

$(document).ready(function () {

    $.getJSON(
        $("meta[name=bmstable]").attr("content"),
        function (header) {

            $.getJSON(header.data_url, function (information) {
                makeBMSTable(information, header.symbol);
            });

        }
    );

});

function makeBMSTable(info, mark) {

    var obj = $("#table_int");

    obj.html("");

    obj.append(
        "<thead class='table-dark'><tr>" +
        "<th>Level</th><th>動画</th><th>Title</th><th>☕</th><th>Artist</th><th>本体</th><th>差分</th><th>Comment</th><th>🎹</th>" +
        "</tr></thead>"
    );

    var tbody = $("<tbody></tbody>");
    obj.append(tbody);

    var currentLevel = "";
    var count = 0;
    var levelRow = null;

    for (var i = 0; i < info.length; i++) {

        if (currentLevel !== info[i].level) {

            if (levelRow) {
                levelRow.html("<td colspan='9'><b>" + mark + currentLevel + " (" + count + "譜面)</b></td>");
            }

            currentLevel = info[i].level;
            count = 0;

            levelRow = $("<tr class='table-dark text-center'></tr>");
            tbody.append(levelRow);
        }

        var row = $("<tr></tr>");

        row.append("<td>" + mark + currentLevel + "</td>");

        row.append(
            "<td>" +
            (info[i].youtube
                ? "<a href='" + info[i].youtube + "' target='_blank'>▶</a>"
                : "null"
            ) +
            "</td>"
        );

        row.append(
            "<td>" +
            (info[i].md5
                ? "<a href='https://www.bms-ir.org/new/song?songmd5=" + info[i].md5 + "' target='_blank'>" + (info[i].title || "") + "</a>"
                : (info[i].title || "")
            ) +
            "</td>"
        );

        row.append(
            "<td>" +
            (info[i].sha256
                ? "<a href='https://mocha-repository.info/song.php?sha256=" + info[i].sha256 + "' target='_blank'>☕</a>"
                : ""
            ) +
            "</td>"
        );

        row.append("<td>" + (info[i].artist || "") + "</td>");

        row.append(
            "<td>" +
            (info[i]["本体"]
                ? "<a href='" + info[i]["本体"] + "' target='_blank'>本体</a>"
                : ""
            ) +
            "</td>"
        );

        row.append(
            "<td>" +
            (info[i]["差分"]
                ? "<a href='" + info[i]["差分"] + "' target='_blank'>差分</a>"
                : ""
            ) +
            "</td>"
        );

        row.append("<td>" + (info[i].comment || "") + "</td>");

        row.append(
            "<td>" +
            (info[i].md5
                ? "<a href='https://bms-score-viewer.pages.dev/view?md5=" + info[i].md5 + "' target='_blank'>🎹</a>"
                : ""
            ) +
            "</td>"
        );

        tbody.append(row);
        count++;
    }

    if (levelRow) {
        levelRow.html("<td colspan='9'><b>" + mark + currentLevel + " (" + count + "譜面)</b></td>");
    }
}

</script>

<!-- 🔥 検索は必ずここに入れる -->
<script>
$(document).on("keyup", "#searchBox", function () {

    const value = $(this).val().toLowerCase();

    $("#table_int tbody tr").each(function () {

        const text = $(this).text().toLowerCase();

        $(this).toggle(
            !$(this).hasClass("table-dark") &&
            text.indexOf(value) > -1
        );

    });

});
</script>
