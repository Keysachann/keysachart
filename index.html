<!DOCTYPE html>
<html lang="ja">

<head>
    <title>Keysa's_Chart_Table</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="bmstable" content="header.json" />
    <script src="https://code.jquery.com/jquery-2.2.4.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ygbV9kiqUc6oa4msXn9868pTtWMgiQaeYH7/t7LECLbyPA2x65Kgf80OJFdroafW" crossorigin="anonymous">
    </script>
</head>

<body>
    <header class="mb-3">
        <nav class="navbar navbar-dark bg-dark">
            <div class="container-fluid">
                <span class="navbar-brand mb-0 h1">Keysa's_Chart_Table</span>
            </div>
        </nav>
    </header>

    <div class="container">

        <div class="alert alert-success mb-3" role="alert">
            <p>きーさ（Keysa）が公開したbms作品や差分を集めました。</p>
            <p>Ksl(n)=sl(n)、Kst(n)=st(n)、K?は査定困難。</p>
            <hr>
            <p class="mb-0">連絡先 X:@Keysa_Vtuber</p>
        </div>


        <!--ここから難易度表本体-->
        <div>
            <table class="table table-light table-striped table-hover" id="table_int">
            </table>
        </div>
        <script language="javascript" type="text/javascript">
            $(document).ready(function () {
                $.getJSON($("meta[name=bmstable]").attr("content"), function (header) {
                    $.getJSON(header.data_url, function (information) {
                        makeBMSTable(information, header.symbol);
                    });
                });
            });

            function makeBMSTable(info, mark) {
                var obj = $("#table_int");
    obj.html("");

    obj.append(
        "<thead class='table-dark'>" +
        "<tr>" +
        "<th>Level</th><th>Title</th><th>Artist</th><th>本体</th><th>差分</th><th>Comment</th>" +
        "</tr></thead>"
    );

    var tbody = $("<tbody></tbody>");
    obj.append(tbody);

    var currentLevel = "";
    var count = 0;
    var levelRow = null;

    for (var i = 0; i < info.length; i++) {

        if (currentLevel !== info[i].level) {
            if (levelRow) {
                levelRow.html("<td colspan='6'><b>" + mark + currentLevel + " (" + count + "譜面)</b></td>");
            }

            currentLevel = info[i].level;
            count = 0;

            levelRow = $("<tr class='table-dark text-center'></tr>");
            tbody.append(levelRow);
        }

        var row = $("<tr></tr>");

        row.append("<td>" + mark + currentLevel + "</td>");

        row.append(
            "<td>" +
            "<a href='https://www.dream-pro.info/~lavalse/LR2IR/search.cgi?mode=ranking&bmsmd5=" +
            info[i].md5 +
            "' target='_blank'>" +
            info[i].title +
            "</a></td>"
        );

        row.append("<td>" + (info[i].artist || "") + "</td>");

        row.append("<td>" +
            (info[i]["本体"] ? "<a href='" + info[i]["本体"] + "' target='_blank'>本体</a>" : "") +
            "</td>");

        row.append("<td>" +
            (info[i]["差分"] ? "<a href='" + info[i]["差分"] + "' target='_blank'>差分</a>" : "") +
            "</td>");

        row.append("<td>" + (info[i].comment || "") + "</td>");

        tbody.append(row);
        count++;
    }

    if (levelRow) {
        levelRow.html("<td colspan='6'><b>" + mark + currentLevel + " (" + count + "譜面)</b></td>");
    }
}

        </script>
    </div>
</body>
</html>
